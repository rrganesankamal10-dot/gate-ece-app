name: Build GATE ECE Release (APK & Play Store AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK & AAB Bundle
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17 (recommended for modern Android Gradle builds)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # 3. Setup Flutter stable
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Print tool versions for transparency
      - name: Print versions
        run: |
          flutter --version
          java -version

      # 5. Fetch dependencies
      - name: Get packages
        run: flutter pub get

      # 6. Build Release APK (for direct phone install & testing)
      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      # 7. Build Android App Bundle (AAB for Google Play Store publication)
      - name: Build Release App Bundle (AAB)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      # 8. Upload Release APK artifact (Direct download for Android phone testing)
      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GATE-ECE-Master-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      # 9. Upload Release AAB artifact (For Google Play Store Console upload)
      - name: Upload Release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: GATE-ECE-Master-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
