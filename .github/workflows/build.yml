name: Build GATE ECE APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17 (required for Android builds)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # 3. Setup Flutter stable (no specific version – always uses latest stable)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 4. Print versions for debugging
      - name: Print versions
        run: |
          flutter --version
          java -version

      # 5. Get Flutter packages
      - name: Get packages
        run: flutter pub get

      # 6. Build release APK (skip validation to avoid version mismatch warnings)
      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      # 7. Upload APK as downloadable artifact (available for 30 days)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GATE-ECE-Master-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
